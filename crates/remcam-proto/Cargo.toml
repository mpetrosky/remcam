[package]
name = "remcam-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = "0.11.12"
rcgen = "0.14.10"
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
spake2 = "0.4.0"
tokio = { version = "1.53.2", features = ["io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }
